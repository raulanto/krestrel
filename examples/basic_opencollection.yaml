opencollection: 1.0.0
info:
  name: JSONPlaceholder API
  summary: Fake Online REST API for Testing
  version: 1.0.0
bundled: true
items:
- info:
    name: Users
    type: folder
  items:
  - info:
      name: List Users
      type: http
    http:
      method: GET
      url: '{{baseUrl}}/users'
      headers:
      - name: Accept
        value: application/json
      params:
      - name: limit
        value: '10'
      auth:
        type: bearer
        token: '{{apiKey}}'
- info:
    name: Create Post
    type: http
  http:
    method: POST
    url: '{{baseUrl}}/posts'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: '{"title":"foo","body":"bar","userId":1}'
config:
  environments:
  - name: Development
    variables:
    - name: baseUrl
      value: https://jsonplaceholder.typicode.com
    - name: apiKey
      secret: true
